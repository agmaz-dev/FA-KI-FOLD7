name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        id: build
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "FoldKI-$VERSION.apk"

      # Extra copy only; the GitHub release below is the download. Never let a full artifact storage stop the release.
      # Unit tests (LetterMeta, DocumentParser, SenderProfile, TaskExtractor, ThinkParser, HfModels). Shown in the log, APK is published anyway.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew --no-daemon testReleaseUnitTest

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 1
          name: FoldKI-${{ steps.build.outputs.version }}
          path: FoldKI-*.apk

      - name: Publish as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Fold KI ${{ steps.build.outputs.version }} (Build ${{ github.run_number }})
          body: "Fold KI ${{ steps.build.outputs.version }} – APK zum direkten Installieren auf Android. Branch: ${{ github.ref_name }}"
          files: FoldKI-*.apk
          make_latest: true
